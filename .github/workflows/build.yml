# =============================================================================
# build.yml — Build do OPL PT-BR Mod em cada push/PR (e via Pipeline Semanal)
#
# Aciona em:
#   - Push para main ou ptbr-mod
#   - Pull request para main
#   - workflow_dispatch (usado pelo weekly-pipeline.yml como validação)
#
# Output:
#   - Artifact OPNPS2LD-<sha>: OPNPS2LD.ELF + lang_Portuguese_BR.lng
#     + font_Portuguese_BR.ttf + INFO.txt (90 dias)
#
# Pós-build, valida ANTES de publicar o artifact:
#   - ELF MIPS válido (magic 7f 45 4c 46)
#   - Tamanho plausível (2–8 MB)
#   - PT-BR realmente embutido (lang_internal.c com caracteres acentuados)
# =============================================================================
name: Build OPL PT-BR Mod

on:
  push:
    branches: [main, ptbr-mod]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ATENÇÃO: a imagem ps2dev/ps2dev (Alpine) NÃO tem bash. O default é sh.
# O primeiro step instala o bash; os steps seguintes usam shell: bash.

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout mod repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # ps2dev/ps2dev:latest já traz ps2sdk + gsKit + ports + ps2-packer.
          # Alpine minimal não inclui as tools abaixo.
          apk add --no-cache python3 py3-yaml zip git bash make

      - name: Verify environment
        run: |
          echo "ps2-packer: $(which ps2-packer)"
          echo "ee-gcc:     $(which ee-gcc 2>/dev/null || which mips64r59002el-elf-gcc 2>/dev/null || echo 'NÃO ENCONTRADO')"
          echo "python3:    $(python3 --version)"
          python3 -c "import yaml; print('pyyaml:    OK')"

      - name: Clone upstream OPL (branch master — default real)
        run: |
          git clone --depth 1 -b master https://github.com/ps2homebrew/Open-PS2-Loader.git opl
          echo "UPSTREAM_SHA=$(cd opl && git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply mods (âncoras rígidas — falha se upstream mudou)
        run: bash scripts/apply-mods.sh opl

      - name: Build OPL
        working-directory: opl
        run: make -j"$(nproc)" NOT_PACKED=0 DEBUG=0 PADEMU=0

      - name: Validate build output
        working-directory: opl
        shell: bash
        run: |
          set -euo pipefail
          test -f OPNPS2LD.ELF || { echo "ERRO: OPNPS2LD.ELF não gerado"; exit 1; }

          head -c 4 OPNPS2LD.ELF | od -An -tx1 | grep -q "7f 45 4c 46" \
            || { echo "ERRO: OPNPS2LD.ELF não é um ELF válido"; exit 1; }

          SIZE=$(stat -c%s OPNPS2LD.ELF)
          # Faixa plausível p/ build enxuta + packed (ps2-packer): ~1.3 MB real.
          if [ "$SIZE" -lt 500000 ] || [ "$SIZE" -gt 5000000 ]; then
            echo "ERRO: tamanho do ELF suspeito (${SIZE} bytes; esperado 0.5–5 MB)"
            exit 1
          fi

          # PT-BR realmente embutido? lang_internal.c usa escapes \u00XX.
          # Inglês puro = 0 ocorrências; PT-BR real = 200+ (calibrado localmente).
          PTBR_HITS=$(grep -oF -e 'u00e3' -e 'u00e7' -e 'u00ed' -e 'u00e9' -e 'u00f5' src/lang_internal.c | wc -l)
          if [ "$PTBR_HITS" -lt 100 ]; then
            echo "ERRO: PT-BR não embutido em lang_internal.c (${PTBR_HITS} hits)"
            exit 1
          fi

          echo "✅ ELF MIPS válido (${SIZE} bytes), PT-BR embutido confirmado"

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp opl/OPNPS2LD.ELF artifact/
          cp opl/lng/lang_Portuguese_BR.lng artifact/ 2>/dev/null || true
          cp opl/lng_src/thirdparty/font_Portuguese_BR.ttf artifact/ 2>/dev/null || true

          OPL_VERSION=$(cd opl && make oplversion 2>/dev/null || echo 'unknown')
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          cat > artifact/INFO.txt <<EOF
          OPL PT-BR Mod — Build ${GITHUB_SHA::7}
          ============================================
          Upstream SHA: ${UPSTREAM_SHA}
          Mod SHA:      ${GITHUB_SHA}
          Build date:   ${BUILD_DATE}
          Versão OPL:   ${OPL_VERSION}

          Perfil: Balanced-Optimized + USB-default + PT-BR embutido
          Sources ativas por default: USB (BDM)
          Sources desativadas (compiladas): HDD, ETH/SMB, APP
          Recursos desativados no build: PADEMU, GSM, IGS, ILINK, MX4SIO, RTL

          Instalação:
            1. Copie OPNPS2LD.ELF para mc0:/OPL/ (via uLaunchELF, FTP, etc.)
            2. (Opcional) Copie lang_Portuguese_BR.lng e font_Portuguese_BR.ttf
            3. Boot via FreeMcBoot / FreeHDBoot / uLaunchELF
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPNPS2LD-${{ github.sha }}
          path: artifact/
          retention-days: 90
          if-no-files-found: error
